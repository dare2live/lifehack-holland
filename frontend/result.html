<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="志途 LifeHack 生涯测评结果">
    <title>志途 LifeHack · 测评结果</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

    <div class="container" id="result-container">
        <!-- Loading state -->
        <div id="loading" style="padding: 4rem 0; text-align: center;">
            <div class="spinner"></div>
            <p class="loading-text">正在生成测评摘要...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/chart.js"></script>
    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const submissionId = params.get('id');
            const returnUrl = params.get('return_url');

            if (!submissionId) {
                document.getElementById('result-container').innerHTML = `
                    <div class="result-header">
                        <div class="result-header__mark" aria-hidden="true"></div>
                        <h1 class="result-header__title">未找到测评记录</h1>
                        <p class="result-header__sub">请先完成问卷后再查看结果</p>
                        <a href="index.html" class="btn btn--primary" style="margin-top:1.5rem;">去做测评</a>
                    </div>`;
                return;
            }

            try {
                // Fetch report and config in parallel
                const [report, config] = await Promise.all([
                    SjtApi.getReport(submissionId),
                    SjtApi.getConfig()
                ]);
                const container = document.getElementById('result-container');
                renderReport(report, config, container);
                if (returnUrl) {
                    const safeReturnUrl = new URL(returnUrl, window.location.href);
                    safeReturnUrl.searchParams.set('holland_submission_id', submissionId);
                    const action = document.createElement('div');
                    action.className = 'result-actions';
                    const link = document.createElement('a');
                    link.className = 'btn btn--primary';
                    link.href = safeReturnUrl.toString();
                    link.textContent = '返回主项目并同步';
                    action.appendChild(link);
                    container.appendChild(action);
                }
            } catch (err) {
                document.getElementById('result-container').innerHTML = `
                    <div class="result-header">
                        <div class="result-header__mark" aria-hidden="true"></div>
                        <h1 class="result-header__title">报告加载失败</h1>
                        <p class="result-header__sub">${err.message}</p>
                        <a href="index.html" class="btn btn--ghost" style="margin-top:1.5rem;">返回首页</a>
                    </div>`;
            }
        })();
    </script>
</body>
</html>

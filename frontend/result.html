<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="你的双核生涯测评结果 — MBTI + 霍兰德综合报告">
    <title>测评结果 — 双核生涯测评</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

    <div class="container" id="result-container">
        <!-- Loading state -->
        <div id="loading" style="padding: 4rem 0; text-align: center;">
            <div class="spinner"></div>
            <p class="loading-text">正在生成你的专属报告...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/chart.js"></script>
    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const submissionId = params.get('id');

            if (!submissionId) {
                document.getElementById('result-container').innerHTML = `
                    <div class="result-header">
                        <div class="result-header__icon">❌</div>
                        <h1 class="result-header__title">未找到测评记录</h1>
                        <p class="result-header__sub">请先完成问卷后再查看结果</p>
                        <a href="index.html" class="btn btn--primary" style="margin-top:1.5rem;">去做测评 →</a>
                    </div>`;
                return;
            }

            try {
                // Fetch report and config in parallel
                const [report, config] = await Promise.all([
                    SjtApi.getReport(submissionId),
                    SjtApi.getConfig()
                ]);
                const container = document.getElementById('result-container');
                renderReport(report, config, container);
            } catch (err) {
                document.getElementById('result-container').innerHTML = `
                    <div class="result-header">
                        <div class="result-header__icon">⚠️</div>
                        <h1 class="result-header__title">报告加载失败</h1>
                        <p class="result-header__sub">${err.message}</p>
                        <a href="index.html" class="btn btn--ghost" style="margin-top:1.5rem;">← 返回首页</a>
                    </div>`;
            }
        })();
    </script>
</body>
</html>

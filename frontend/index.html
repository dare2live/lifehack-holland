<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="双核生涯测评引擎 — 基于情境判断的 MBTI + 霍兰德综合测评，专为高中生设计">
    <title>生涯测评 — 双核情境判断测试</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Progress Bar (sticky) -->
    <div class="progress-wrapper" id="progress-wrapper" style="display:none;">
        <div class="progress-bar">
            <div class="progress-bar__track">
                <div class="progress-bar__fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <div class="progress-bar__label">
                <span>答题进度</span>
                <span id="progress-label">0 / 0</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero" id="hero">
            <div class="hero__badge">
                <span class="hero__badge-dot"></span>
                Situational Judgement Test
            </div>
            <h1 class="hero__title">发现你的核心特质</h1>
            <p class="hero__subtitle">
                通过真实场景中的直觉反应，精准解码你的性格偏好与职业兴趣——不是"你觉得自己怎样"，而是"你在那一刻会怎么做"
            </p>
            <button class="btn btn--primary" id="btn-start" onclick="startSurvey()">
                开始测评 →
            </button>
        </div>

        <!-- Survey Container (hidden until start) -->
        <div id="survey-container" style="display:none;"></div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/survey_config.js"></script>
    <script>
        let survey;

        async function startSurvey() {
            // Hide hero, show survey
            document.getElementById('hero').style.display = 'none';
            document.getElementById('survey-container').style.display = 'block';
            document.getElementById('progress-wrapper').style.display = 'block';

            // Initialize survey
            survey = new SjtSurvey('survey-container');
            await survey.init();
        }
    </script>
</body>
</html>

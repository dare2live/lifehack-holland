<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="志途 LifeHack 生涯测评 — 基于连续情境选择的兴趣与行动偏好观察">
    <title>志途 LifeHack · 生涯测评</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Progress Bar (sticky) -->
    <div class="progress-wrapper" id="progress-wrapper" style="display:none;">
        <div class="progress-bar">
            <div class="progress-bar__track">
                <div class="progress-bar__fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <div class="progress-bar__label">
                <span>答题进度</span>
                <span id="progress-label">0 / 0</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero" id="hero">
            <div class="hero__badge">
                <span class="hero__badge-mark"></span>
                Career Fit
            </div>
            <h1 class="hero__title">生涯测评</h1>
            <p class="hero__subtitle">
                通过连续场景中的行动选择，观察兴趣、协作方式和长期投入方向，结果会并入当前案例。
            </p>
            <button class="btn btn--primary" id="btn-start" onclick="startSurvey()">
                开始测评
            </button>
        </div>

        <!-- Survey Container (hidden until start) -->
        <div id="survey-container" style="display:none;"></div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/survey_config.js"></script>
    <script>
        let survey;

        async function startSurvey() {
            // Hide hero, show survey
            document.getElementById('hero').style.display = 'none';
            document.getElementById('survey-container').style.display = 'block';
            document.getElementById('progress-wrapper').style.display = 'block';

            // Initialize survey
            const params = new URLSearchParams(window.location.search);
            survey = new SjtSurvey('survey-container', {
                core_case_id: params.get('case_id') || '',
                return_url: params.get('return_url') || '',
                source: params.get('source') || '',
            });
            await survey.init();
        }
    </script>
</body>
</html>
